name: iOS starter workflow

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    name: Build iOS Simulator App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        
      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
         
      - name: Cache Swift Package Manager
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.workflow }}-
          deriveddata-directory: ~/Library/Developer/Xcode/DerivedData
          sourcepackages-directory: ~/Library/Developer/Xcode/DerivedData/SourcePackages

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project RemoteRecruit.xcodeproj \
            -scheme RemoteRecruit \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -configuration Debug \
            COMPILER_INDEX_STORE_ENABLE=YES
